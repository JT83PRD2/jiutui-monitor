name: jiutui-monitor

on:
  schedule:
    - cron: '*/10 * * * *'   # 每 10 分钟检查一次
  workflow_dispatch:
    inputs:
      test_notify:
        description: '勾选则发送一条测试通知（验证微信/邮件通道）'
        type: boolean
        default: false

permissions:
  contents: write             # 允许把 state.json 回推仓库

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ "${{ github.event.inputs.test_notify }}" = "true" ]; then
            python monitor.py --test-notify
          else
            python monitor.py --once
          fi

      - name: Commit state
        if: github.event.inputs.test_notify != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "chore: update monitor state"
          git push
